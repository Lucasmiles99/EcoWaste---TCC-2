<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
        EcoWaste
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <header class="ecowaste-header">

        <div class="container-fluid">

            <div
                class="
                    row
                    align-items-center
                    w-100
                "
            >

                <div
                    class="
                        col-4
                        text-start
                    "
                >

                    <div class="logo-ifc-box">

                        <img
                            src="{{ url_for('static', filename='img/logo-ifc.png') }}"
                            alt="Instituto Federal Catarinense - Campus Rio do Sul"
                            class="logo-ifc"
                        >

                    </div>

                </div>

                <div
                    class="
                        col-4
                        text-center
                    "
                >

                    <h1 class="ecowaste-title">
                        <span class="eco">Eco</span><span class="waste">Waste</span>
                    </h1>

                </div>

                <div
                    class="
                        col-4
                        text-end
                    "
                >

                    <img
                        src="{{ url_for('static', filename='img/logo-sustentabilidade.png') }}"
                        alt="Sustentabilidade"
                        class="logo-sustentabilidade"
                    >

                </div>

            </div>

        </div>

    </header>

    <main class="container py-4">

        {% block content %}
        {% endblock %}

    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    >
    </script>

</body>

</html>
