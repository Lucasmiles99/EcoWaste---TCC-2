{% extends "base.html" %}

{% block title %}
Nova Empresa - EcoWaste
{% endblock %}

{% block content %}

<h2>
    Cadastrar Empresa
</h2>

<p>
    Preencha os dados para cadastrar uma nova empresa.
</p>

<hr>

<form method="POST">

    <div class="mb-3">

        <label class="form-label">
            Nome da empresa:
        </label>

        <input
            type="text"
            name="nome"
            class="form-control"
            required
        >

    </div>

    <div class="mb-3">

        <label class="form-label">
            Cidade:
        </label>

        <input
            type="text"
            name="cidade"
            class="form-control"
            required
        >

    </div>

    <div class="mb-3">

        <label class="form-label">
            Segmento:
        </label>

        <input
            type="text"
            name="segmento"
            class="form-control"
        >

    </div>

    <div class="mb-3">

        <label class="form-label">
            Contato:
        </label>

        <input
            type="text"
            name="contato"
            class="form-control"
        >

    </div>

    <button
        type="submit"
        class="btn btn-success"
    >
        Cadastrar Empresa
    </button>

    <a
        href="/empresas"
        class="btn btn-secondary"
    >
        Voltar para empresas
    </a>

</form>

{% endblock %}
