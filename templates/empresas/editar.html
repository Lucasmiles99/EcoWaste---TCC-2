{% extends "base.html" %}

{% block title %}
Editar Empresa - EcoWaste
{% endblock %}

{% block content %}

<h2>
    Editar Empresa
</h2>

<p>
    Altere os dados da empresa selecionada.
</p>

<hr>

<form method="POST">

    <div class="mb-3">

        <label class="form-label">
            Nome da empresa:
        </label>

        <input
            type="text"
            name="nome"
            value="{{ empresa.nome }}"
            class="form-control"
            required
        >

    </div>

    <div class="mb-3">

        <label class="form-label">
            Cidade:
        </label>

        <input
            type="text"
            name="cidade"
            value="{{ empresa.cidade }}"
            class="form-control"
            required
        >

    </div>

    <div class="mb-3">

        <label class="form-label">
            Segmento:
        </label>

        <input
            type="text"
            name="segmento"
            value="{{ empresa.segmento }}"
            class="form-control"
        >

    </div>

    <div class="mb-3">

        <label class="form-label">
            Contato:
        </label>

        <input
            type="text"
            name="contato"
            value="{{ empresa.contato }}"
            class="form-control"
        >

    </div>

    <button
        type="submit"
        class="btn btn-success"
    >
        Salvar alterações
    </button>

    <a
        href="/empresas"
        class="btn btn-secondary"
    >
        Voltar para empresas
    </a>

</form>

{% endblock %}
