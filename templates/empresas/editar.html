<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Editar Empresa - EcoWaste</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <header class="ecowaste-header">

        <div class="container-fluid">

            <div class="row align-items-center w-100">

                <div class="col-4 text-start">

                    <img
                        src="{{ url_for('static', filename='img/logo-ifc.jpg') }}"
                        alt="Instituto Federal Catarinense"
                        class="logo-ifc"
                    >

                </div>

                <div class="col-4 text-center">

                    <h1 class="ecowaste-title">
                        EcoWaste
                    </h1>

                </div>

                <div class="col-4 text-end">

                    <img
                        src="{{ url_for('static', filename='img/logo-sustentabilidade.png') }}"
                        alt="Sustentabilidade"
                        class="logo-sustentabilidade"
                    >

                </div>

            </div>

        </div>

    </header>

    <main>

        <h2>Editar Empresa</h2>

        <p>
            Altere os dados da empresa selecionada.
        </p>

        <hr>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Nome da empresa:
                </label>

                <input
                    type="text"
                    name="nome"
                    value="{{ empresa.nome }}"
                    class="form-control"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Cidade:
                </label>

                <input
                    type="text"
                    name="cidade"
                    value="{{ empresa.cidade }}"
                    class="form-control"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Segmento:
                </label>

                <input
                    type="text"
                    name="segmento"
                    value="{{ empresa.segmento }}"
                    class="form-control"
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Contato:
                </label>

                <input
                    type="text"
                    name="contato"
                    value="{{ empresa.contato }}"
                    class="form-control"
                >

            </div>

            <button
                type="submit"
                class="btn btn-success"
            >
                Salvar alterações
            </button>

            <a
                href="/empresas"
                class="btn btn-secondary"
            >
                Voltar para empresas
            </a>

        </form>

    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    >
    </script>

</body>

</html>
