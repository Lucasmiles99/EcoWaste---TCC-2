{% extends "base.html" %}

{% block title %}
Registrar Descarte - EcoWaste
{% endblock %}

{% block content %}

<div class="card">

    <div class="card-body">

        <h2 class="mb-4">
            Registrar Descarte
        </h2>

        <form
            action="/descartes/novo"
            method="POST"
        >

            <label for="empresa_id">
                Empresa
            </label>

            <select
                id="empresa_id"
                name="empresa_id"
                required
            >

                <option value="">
                    Selecione uma empresa
                </option>

                {% for empresa in empresas %}

                <option value="{{ empresa.id }}">
                    {{ empresa.nome }}
                </option>

                {% endfor %}

            </select>

            <label for="equipamento_id">
                Equipamento
            </label>

            <select
                id="equipamento_id"
                name="equipamento_id"
                required
            >

                <option value="">
                    Selecione um equipamento
                </option>

                {% for equipamento in equipamentos %}

                <option value="{{ equipamento.id }}">
                    {{ equipamento.nome }}
                </option>

                {% endfor %}

            </select>

            <label for="ecoponto_id">
                Ecoponto
            </label>

            <select
                id="ecoponto_id"
                name="ecoponto_id"
            >

                <option value="">
                    Não informar ecoponto
                </option>

                {% for ecoponto in ecopontos %}

                <option value="{{ ecoponto.id }}">
                    {{ ecoponto.nome }}
                </option>

                {% endfor %}

            </select>

            <label for="quantidade">
                Quantidade
            </label>

            <input
                type="number"
                id="quantidade"
                name="quantidade"
                min="1"
                value="1"
                required
            >

            <label for="data_descarte">
                Data do descarte
            </label>

            <input
                type="date"
                id="data_descarte"
                name="data_descarte"
            >

            <label for="status">
                Status
            </label>

            <select
                id="status"
                name="status"
            >

                <option value="">
                    Selecione um status
                </option>

                <option value="Planejado">
                    Planejado
                </option>

                <option value="Aguardando coleta">
                    Aguardando coleta
                </option>

                <option value="Em transporte">
                    Em transporte
                </option>

                <option value="Realizado">
                    Realizado
                </option>

                <option value="Cancelado">
                    Cancelado
                </option>

            </select>

            <label for="observacao">
                Observação
            </label>

            <textarea
                id="observacao"
                name="observacao"
                rows="4"
                placeholder="Digite alguma informação adicional sobre o descarte."
            ></textarea>

            <div class="d-flex gap-2 mt-3">

                <button
                    type="submit"
                    class="btn btn-success"
                >
                    Registrar descarte
                </button>

                <a
                    href="/descartes"
                    class="btn btn-secondary"
                >
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
