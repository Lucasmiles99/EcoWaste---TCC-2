{% extends "base.html" %}

{% block title %}
Editar Descarte - EcoWaste
{% endblock %}

{% block content %}

<div class="card">

    <div class="card-body">

        <h2 class="mb-4">
            Editar Descarte
        </h2>

        <form
            action="/descartes/{{ descarte.id }}/editar"
            method="POST"
        >

            <label for="empresa_id">
                Empresa
            </label>

            <select
                id="empresa_id"
                name="empresa_id"
                required
            >

                <option value="">
                    Selecione uma empresa
                </option>

                {% for empresa in empresas %}

                <option
                    value="{{ empresa.id }}"
                    {% if empresa.id == descarte.empresa_id %}
                    selected
                    {% endif %}
                >
                    {{ empresa.nome }}
                </option>

                {% endfor %}

            </select>

            <label for="equipamento_id">
                Equipamento
            </label>

            <select
                id="equipamento_id"
                name="equipamento_id"
                required
            >

                <option value="">
                    Selecione um equipamento
                </option>

                {% for equipamento in equipamentos %}

                <option
                    value="{{ equipamento.id }}"
                    {% if equipamento.id == descarte.equipamento_id %}
                    selected
                    {% endif %}
                >
                    {{ equipamento.nome }}
                </option>

                {% endfor %}

            </select>

            <label for="ecoponto_id">
                Ecoponto
            </label>

            <select
                id="ecoponto_id"
                name="ecoponto_id"
            >

                <option value="">
                    Não informar ecoponto
                </option>

                {% for ecoponto in ecopontos %}

                <option
                    value="{{ ecoponto.id }}"
                    {% if ecoponto.id == descarte.ecoponto_id %}
                    selected
                    {% endif %}
                >
                    {{ ecoponto.nome }}
                </option>

                {% endfor %}

            </select>

            <label for="quantidade">
                Quantidade
            </label>

            <input
                type="number"
                id="quantidade"
                name="quantidade"
                min="1"
                value="{{ descarte.quantidade }}"
                required
            >

            <label for="data_descarte">
                Data do descarte
            </label>

            <input
                type="date"
                id="data_descarte"
                name="data_descarte"
                value="{{ descarte.data_descarte }}"
            >

            <label for="status">
                Status
            </label>

            <select
                id="status"
                name="status"
            >

                <option value="">
                    Selecione um status
                </option>

                <option
                    value="Planejado"
                    {% if descarte.status == "Planejado" %}
                    selected
                    {% endif %}
                >
                    Planejado
                </option>

                <option
                    value="Aguardando coleta"
                    {% if descarte.status == "Aguardando coleta" %}
                    selected
                    {% endif %}
                >
                    Aguardando coleta
                </option>

                <option
                    value="Em transporte"
                    {% if descarte.status == "Em transporte" %}
                    selected
                    {% endif %}
                >
                    Em transporte
                </option>

                <option
                    value="Realizado"
                    {% if descarte.status == "Realizado" %}
                    selected
                    {% endif %}
                >
                    Realizado
                </option>

                <option
                    value="Cancelado"
                    {% if descarte.status == "Cancelado" %}
                    selected
                    {% endif %}
                >
                    Cancelado
                </option>

            </select>

            <label for="observacao">
                Observação
            </label>

            <textarea
                id="observacao"
                name="observacao"
                rows="4"
            >{{ descarte.observacao or "" }}</textarea>

            <div class="d-flex gap-2 mt-3">

                <button
                    type="submit"
                    class="btn btn-success"
                >
                    Salvar alterações
                </button>

                <a
                    href="/descartes"
                    class="btn btn-secondary"
                >
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
